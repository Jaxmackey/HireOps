<div class="min-h-screen bg-gray-900 text-white p-6">
  <header class="mb-8">
    <h1 class="text-3xl font-bold">🎮 HireOps Simulator</h1>
    <p class="text-gray-400">High-load recruitment pipeline demo</p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Левая колонка: Управление -->
    <div class="space-y-6">
      <app-worker-controls />

      <!-- Кнопки запуска волны -->
      <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
        <h3 class="text-lg font-semibold mb-4">🚀 Start Wave</h3>
        <div class="flex gap-2">
          <button (click)="startWave(100)" class="flex-1 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded transition">
            100 applicants
          </button>
          <button (click)="startWave(1000)" class="flex-1 bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded transition">
            1000 applicants
          </button>
        </div>
      </div>
    </div>

    <!-- Правая колонка: Метрики -->
    <div class="lg:col-span-2 bg-gray-800 p-4 rounded-lg border border-gray-700">
      <h3 class="text-lg font-semibold mb-4">📊 Real-time Metrics</h3>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="bg-gray-700 p-3 rounded">
          <div class="text-sm text-gray-400">Queue Depth</div>
          <div class="text-2xl font-mono">{{ signalr.metrics()?.queueDepth ?? 0 }}</div>
        </div>
        <div class="bg-gray-700 p-3 rounded">
          <div class="text-sm text-gray-400">Latency (ms)</div>
          <div class="text-2xl font-mono">{{ signalr.metrics()?.latency ?? 0 }}</div>
        </div>
      </div>

      <!-- Место для будущего графика -->
      <div class="h-64 bg-gray-700 rounded flex items-center justify-center text-gray-500">
