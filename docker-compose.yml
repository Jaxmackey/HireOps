version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hireops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: ["5672:5672", "15672:15672"]

  seq:
    image: datalust/seq:2024.3  # ✅ Рабочая версия (формат: год.месяц)
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "53499:80"      # ✅ Высокий порт, маловероятен конфликт
      - "53498:5341"    # Порт приёма логов
    volumes:
      - seq_data:/data  # ✅ Обязательно: хранилище индексов и метаданных
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  seq_data:             # ✅ Volume для Seq